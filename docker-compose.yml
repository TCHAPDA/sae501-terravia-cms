services:
  backend:
    build: .
    container_name: backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: terravia_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: terravia
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: terravia_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
    depends_on:
      - database

volumes:
  db_data:
